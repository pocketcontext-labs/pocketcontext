name: Hosted container image
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hosted-image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  IMAGE: ghcr.io/pocketcontext-labs/pocketcontext
jobs:
  tests:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Synthetic complete-backup and restore tests
        run: python3 docker/test_backups.py -v
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          load: true
          tags: pocketcontext:ci
          build-args: REVISION=${{ github.sha }}
          provenance: false
          cache-from: type=gha,scope=hosted-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=hosted-${{ matrix.arch }}
      - name: Actual container lifecycle and isolation
        run: python3 docker/smoke.py --image pocketcontext:ci
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.13.6'
      - name: Deployment workflow guards
        run: uv run tests/hosted_deploy_workflow.py -v
      - name: Populated HTTPS S3 backup and disaster restore
        run: uv run docker/recovery.py --image pocketcontext:ci
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [tests, check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Publish validated architecture by digest
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: REVISION=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          cache-from: type=gha,scope=hosted-${{ matrix.arch }}
      - name: Record image digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          test -n "$DIGEST"
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hosted-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 7
  manifest:
    needs: publish
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: hosted-digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Require current main revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ ! "$head" =~ ^[0-9a-f]{40}$ || "$head" != "$GITHUB_SHA" ]]; then
            echo 'Refusing stale release: workflow revision is not current main.' >&2
            exit 1
          fi
      - name: Assemble source and latest tags
        id: manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          digests=(*)
          test "${#digests[@]}" = 2
          sources=()
          for digest in "${digests[@]}"; do
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
            sources+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create -t "$IMAGE:sha-$GITHUB_SHA" -t "$IMAGE:latest" "${sources[@]}"
          digest=$(docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" --format '{{json .Manifest}}' | jq -er '.digest')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CONTEXT_DEPLOY_PAUSED != 'true' && vars.COLORS_PROFILE != ''
    needs: manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    environment:
      name: ${{ vars.COLORS_PROFILE }}
    concurrency:
      group: deploy-${{ vars.COLORS_PROFILE }}
      cancel-in-progress: false
    steps:
      - name: Require current main revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ ! "$head" =~ ^[0-9a-f]{40}$ || "$head" != "$GITHUB_SHA" ]]; then
            echo 'Refusing stale release: workflow revision is not current main.' >&2
            exit 1
          fi
      - name: Deploy validated digest through restricted SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ vars.SERVER_IP }}
          SERVER_USER: ${{ vars.SERVER_USER }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
          DEPLOY_DIGEST: ${{ needs.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          test -n "$SERVER_IP"
          test -n "$SERVER_USER"
          test -n "$SSH_KNOWN_HOSTS"
          test -n "$SSH_PRIVATE_KEY"
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$ssh_dir/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=5 \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" -i "$ssh_dir/id_ed25519" \
            "$SERVER_USER@$SERVER_IP" "deploy $IMAGE@$DEPLOY_DIGEST" < /dev/null
      - name: Verify every public target
        env:
          SITE_URLS: ${{ vars.SITE_URLS }}
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json, os, subprocess, urllib.parse
          urls = json.loads(os.environ['SITE_URLS'])
          if not isinstance(urls, list) or not urls:
              raise SystemExit('SITE_URLS must contain the deployment targets')
          for origin in urls:
              if not isinstance(origin, str):
                  raise SystemExit('Invalid deployment target')
              parsed = urllib.parse.urlsplit(origin)
              if parsed.scheme != 'https' or not parsed.hostname or parsed.username or parsed.password or parsed.path not in ('', '/') or parsed.query or parsed.fragment:
                  raise SystemExit('Deployment targets must be HTTPS origins')
              subprocess.run(['curl', '--fail', '--silent', '--show-error',
                  '--connect-timeout', '10', '--max-time', '20', '--retry', '12',
                  '--retry-delay', '5', '--retry-max-time', '180', '--retry-all-errors',
                  origin.rstrip('/') + '/up'], check=True)
          PYTHON
